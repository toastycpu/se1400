<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analog Diaries</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="grid-wrapper">
        <div class="grid-item site"></div>
        <section class="grid-wrapper nav-section">
            <div class="grid-item logo"></div>
            <nav class="grid-item nav"></nav>
        </section>
    </header>

    <main>
        <section class="grid-wrapper hero-section">
            <div class="grid-item hero-banner"></div>
            <div class="grid-item cta-button"></div>
        </section>

        <section class="grid-wrapper cards-section">
            <div class="grid-item card card-1"></div>
            <div class="grid-item card card-2"></div>
            <div class="grid-item card card-3"></div>
        </section>

        <section class="grid-wrapper journal-section">
            <div class="grid-item journal entry-1"></div>
            <div class="grid-item journal entry-2"></div>
        </section>
    </main>

    <footer class="grid-wrapper footer">
        <div class="grid-item footer-text"></div>
    </footer>
</body>
</html>
